name: Update GitHub Stats in README

on:
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update GitHub Stats
        run: python update_stats.py
        env:
          PYTHONUNBUFFERED: "1"
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ArturFGaldino

      - name: Commit and push changes
        run: |
          git config --global user.name "ArturFGaldino"
          git config --global user.email "fernandesartur4@gmail.com"
          git add README.md cache/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub Stats in README" && git push)